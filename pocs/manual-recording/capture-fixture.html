<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Chromium Capture Fixture</title></head>
<body>
  <main>
    <h1>窗口捕获 POC</h1>
    <p id="tab-label">tab-1</p>
    <p id="second-tab-note" hidden>这是第二标签页；请与 tab-1 来回切换，确认录像中的页面内容连续变化。</p>
    <a id="open-second-tab" href="./capture-fixture.html?tab=2" target="_blank">打开第二标签页</a>
  </main>
  <script>
    const tab = new URLSearchParams(location.search).get('tab') ?? '1';
    document.querySelector('#tab-label').textContent = `tab-${tab}`;
    if (tab === '2') {
      document.querySelector('#second-tab-note').hidden = false;
      document.querySelector('#open-second-tab').textContent = '已在第二标签页';
    }
  </script>
</body>
</html>
